{% extends "base.html" %}{% block page %}login{% endblock %}{% block content %}<main class="login-wrapper"><section class="login-card"><h1>{{ _('Sign in') }}</h1>{% if error %}<p class="error">{{ _(error) }}</p>{% endif %}{% if oidc_enabled %}<a class="btn" href="/auth/oidc/start">{{ _(oidc_label) }}</a>{% endif %}{% if password_enabled %}<form method="post" action="/login"><label>{{ _('Username') }}<input id="username" name="username" autocomplete="username" maxlength="254" required></label><label>{{ _('Password') }}<input id="password" type="password" name="password" autocomplete="current-password" maxlength="4096" required></label><label>{{ _('Authenticator or recovery code') }}<input name="otp" autocomplete="one-time-code" maxlength="32"></label><button type="submit" class="btn">{{ _('Sign in') }}</button></form>{% endif %}</section></main>{% endblock %}
