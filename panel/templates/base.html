<!DOCTYPE html>
<html lang="{{ language(request) }}" data-theme="dark"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="csrf-token" content="{{ principal.csrf if principal else '' }}"><title>CorpVPN</title><link rel="stylesheet" href="/static/panel.css?v={{ asset_version('panel.css') }}"><script src="/static/ui.js?v={{ asset_version('ui.js') }}" defer></script></head>
<body data-local-account="{{ 'true' if user is defined and user and user.provider == 'local' and user.external_id.startswith('u:') else 'false' }}" data-role="{{ principal.role if principal else '' }}" data-csrf="{{ principal.csrf if principal else '' }}" data-page="{% block page %}{% endblock %}"><header class="topbar"><a class="brand" href="/">CorpVPN <span>{{ _('Corporate VPN') }}</span></a><div class="toolbar"><a href="?lang=en">EN</a><a href="?lang=ru">RU</a>{% if principal %}<span>{{ principal.username }}</span><a href="/me">{{ _('My devices') }}</a><form method="post" action="/logout"><input type="hidden" name="csrf_token" value="{{ principal.csrf }}"><button type="submit">{{ _('Sign out') }}</button></form>{% endif %}</div></header>{% block content %}{% endblock %}<dialog id="modal"><div id="modal-content"></div></dialog><p id="notice" role="status"></p></body></html>
