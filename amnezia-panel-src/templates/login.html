<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход — Amnezia VPN Panel</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
    <style>
        body { background: #0f1117; color: #e0e0e0; display: flex; align-items: center; justify-content: center; min-height: 100vh; }
        .card { background: #1a1d27; border: 1px solid #2d3045; width: 100%; max-width: 360px; }
        .form-control { background: #0f1117; border-color: #2d3045; color: #e0e0e0; }
        .form-control:focus { background: #0f1117; border-color: #4a5080; color: #e0e0e0; box-shadow: none; }
    </style>
</head>
<body>
<div class="card p-4">
    <h4 class="text-center mb-4"><i class="bi bi-shield-lock-fill"></i> Amnezia Panel</h4>
    {% if error %}
    <div class="alert alert-danger py-2 small">{{ error }}</div>
    {% endif %}
    <form method="post" action="/login">
        <div class="mb-3">
            <label class="form-label small text-muted">Токен доступа</label>
            <input type="password" name="token" class="form-control" autofocus required placeholder="Введите токен">
        </div>
        <button type="submit" class="btn btn-primary w-100">Войти</button>
    </form>
</div>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
</body>
</html>
