<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Amnezia VPN Panel{% endblock %}</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <style>
        body { background: #0f1117; color: #e0e0e0; }
        .navbar { background: #1a1d27 !important; border-bottom: 1px solid #2d3045; }
        .card { background: #1a1d27; border: 1px solid #2d3045; }
        .table { --bs-table-bg: transparent; --bs-table-color: #e0e0e0; }
        .table thead th { border-color: #2d3045; color: #888; font-size: 0.8rem; text-transform: uppercase; }
        .table tbody td { border-color: #2d3045; vertical-align: middle; }
        .badge-online { background: #1a4731; color: #4ade80; }
        .badge-inactive { background: #3a2a10; color: #fbbf24; }
        .badge-never { background: #3a1a1a; color: #f87171; }
        .badge-wg { background: #1a2a4a; color: #60a5fa; }
        .badge-vless { background: #11363f; color: #67e8f9; }
        .badge-awg { background: #2a1a4a; color: #a78bfa; }
        .badge-route-ru { background: #1d4d35; color: #86efac; }
        .badge-route-non-ru { background: #3b2f16; color: #fcd34d; }
        .badge-disabled { background: #374151; color: #d1d5db; }
        .btn-sm { font-size: 0.75rem; }
        .stat-card { text-align: center; padding: 1.2rem; }
        .stat-num { font-size: 2rem; font-weight: 700; color: #4ade80; }
        .stat-label { font-size: 0.8rem; color: #888; }
        .modal-content { background: #1a1d27; border: 1px solid #2d3045; color: #e0e0e0; }
        .form-control, .form-select { background: #0f1117; border-color: #2d3045; color: #e0e0e0; }
        .form-control:focus, .form-select:focus { background: #0f1117; border-color: #4a5080; color: #e0e0e0; box-shadow: none; }
        .qr-modal img { max-width: 280px; }
        .preview-rule-card { background: #0f1117; border: 1px solid #2d3045; border-radius: 0.6rem; padding: 0.75rem; }
        .section-note { color: #9ca3af; font-size: 0.85rem; }
        #toast-container { position: fixed; bottom: 1rem; right: 1rem; z-index: 9999; }
    </style>
</head>
<body>
<nav class="navbar navbar-dark">
    <div class="container-fluid">
        <a class="navbar-brand fw-bold" href="/"><i class="bi bi-shield-lock-fill me-2"></i>Amnezia Panel</a>
        <div class="d-flex gap-2 align-items-center">
            <a href="/logout" class="btn btn-outline-secondary btn-sm"><i class="bi bi-box-arrow-right"></i> Выйти</a>
        </div>
    </div>
</nav>
<div class="container-fluid py-3">
    {% block content %}{% endblock %}
</div>

<!-- Toast -->
<div id="toast-container"></div>

<!-- QR Modal -->
<div class="modal fade" id="qrModal" tabindex="-1">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-header border-secondary">
        <h5 class="modal-title">QR-код конфига</h5>
        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body text-center">
        <div id="qr-spinner" class="spinner-border text-primary" role="status"></div>
        <img id="qr-img" src="" alt="QR" class="qr-modal d-none img-fluid rounded">
        <p id="qr-error" class="text-danger d-none mt-2"></p>
        <p id="qr-name" class="mt-2 fw-bold"></p>
      </div>
      <div class="modal-footer border-secondary">
        <a id="qr-download" href="#" class="btn btn-primary btn-sm" download>
          <i class="bi bi-download"></i> Скачать .conf
        </a>
        <button type="button" class="btn btn-secondary btn-sm" data-bs-dismiss="modal">Закрыть</button>
      </div>
    </div>
  </div>
</div>

<!-- Delete Confirm Modal -->
<div class="modal fade" id="deleteModal" tabindex="-1">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-header border-secondary">
        <h5 class="modal-title text-danger"><i class="bi bi-trash3"></i> Удалить пира?</h5>
        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        Вы уверены, что хотите удалить <strong id="delete-name"></strong>?<br>
        <span class="text-muted small">Это действие необратимо.</span>
      </div>
      <div class="modal-footer border-secondary">
        <button type="button" class="btn btn-secondary btn-sm" data-bs-dismiss="modal">Отмена</button>
        <button type="button" class="btn btn-danger btn-sm" id="delete-confirm-btn">Удалить</button>
      </div>
    </div>
  </div>
</div>

<!-- Rename Modal -->
<div class="modal fade" id="renameModal" tabindex="-1">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-header border-secondary">
        <h5 class="modal-title">Переименовать пира</h5>
        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <input type="text" id="rename-input" class="form-control" placeholder="Новое имя">
      </div>
      <div class="modal-footer border-secondary">
        <button type="button" class="btn btn-secondary btn-sm" data-bs-dismiss="modal">Отмена</button>
        <button type="button" class="btn btn-primary btn-sm" id="rename-confirm-btn">Сохранить</button>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="/static/app.js"></script>
{% block scripts %}{% endblock %}
</body>
</html>
