name: CI
on:
  pull_request:
  push:
    branches: [main, v2]
    tags: [v2]
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  python:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python: ['3.10', '3.12', '3.13']
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install --require-hashes -r panel/requirements.lock
      - run: python -m pip install -r requirements.txt
      - run: python -m pyflakes panel tests deploy/quickstart.py
      - run: python -m compileall -q panel tests deploy/quickstart.py
      - run: python -m pytest tests -q
      - run: python tools/release/check_tree.py
  deploy:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - run: python -m pip install -r deploy/requirements.txt
      - run: |
          for script in deploy/quickstart.sh deploy/run.sh tests/test_quickstart.sh tools/acceptance/*.sh; do
            bash -n "$script"
          done
      - run: node --check panel/static/ui.js
      - run: shellcheck -S warning deploy/quickstart.sh deploy/run.sh tests/test_quickstart.sh tools/acceptance/*.sh
      - run: bash tests/test_quickstart.sh < /dev/null
      - run: python -m unittest discover -s tests -p test_source_upgrade.py
      - run: ansible-lint deploy/ansible
      - name: Check all playbooks
        working-directory: deploy/ansible
        run: |
          for play in site.yml site-connector.yml restore.yml uninstall.yml; do
            ansible-playbook --syntax-check -i inventory/hosts.example.yml "$play"
          done
  dependencies:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - run: python -m pip install pip-audit==2.9.0
      - run: pip-audit --require-hashes -r panel/requirements.lock --disable-pip
  secrets:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install checksum-verified scanner
        run: |
          curl --fail --location --output /tmp/gitleaks.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  /tmp/gitleaks.tar.gz' | sha256sum --check
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
      - run: /tmp/gitleaks dir . --redact --no-banner
  native:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - run: python -m pip install -r deploy/requirements.txt
      - run: ansible-playbook -i localhost, -c local --become native-check.yml
        working-directory: deploy/ansible
  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, '[release:v2]')
    needs: [python, deploy, dependencies, secrets, native]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - run: python tools/release/build.py --out "$RUNNER_TEMP/corpvpn-release"
      - run: python tools/release/publish.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_DIR: ${{ runner.temp }}/corpvpn-release
