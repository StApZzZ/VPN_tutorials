- name: Common | Verify supported OS family
  ansible.builtin.assert:
    that:
      - ansible_os_family == "Debian"
    fail_msg: "This automation currently supports Debian-family hosts only."

- name: Common | Install system packages
  ansible.builtin.apt:
    name: "{{ vpn_panel_system_packages }}"
    state: present
    update_cache: true
    policy_rc_d: 101
