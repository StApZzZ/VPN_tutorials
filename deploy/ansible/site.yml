---
- name: Deploy CorpVPN
  hosts: "{{ groups['management'] | default(groups['all']) }}"
  become: true
  gather_facts: true
  roles:
    - role: preflight
      tags:
        - preflight
    - role: common
      tags:
        - common
    - role: network_policy
      tags:
        - network_policy
    - role: wg_server
      tags:
        - wg_server
    - role: awg_server
      tags:
        - awg_server
    - role: xray
      tags:
        - xray
    - role: app
      tags:
        - app
    - role: nginx
      tags:
        - nginx
    - role: backup
      tags:
        - backup
    - role: healthcheck
      tags:
        - healthcheck
    - role: smoke
      tags:
        - smoke
  vars_files:
    - ../versions.yml
